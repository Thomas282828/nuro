<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>kaideno</title>
<link rel="canonical" href="https://kaideno.com/">
</head>
<body>
<script>
  // Ancienne adresse de la page d'accueil. On redirige :
  //  - vers l'app si la requete vient d'un retour de paiement Stripe (?checkout=...)
  //  - vers la vitrine (racine) dans tous les autres cas.
  (function () {
    var q = window.location.search || '';
    var dest = /[?&]checkout=/.test(q) ? ('app.html' + q) : ('./' + q);
    window.location.replace(dest);
  })();
</script>
<noscript><a href="./">Aller sur kaideno</a></noscript>
</body>
</html>
